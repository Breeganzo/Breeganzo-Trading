# ============================================================================
# QuantDesk Pro — GitHub Actions: Keep Alive Ping
# Prevents Render free-tier from spinning down during market hours
# ============================================================================

name: Keep Alive

on:
  schedule:
    # Every 14 minutes during IST market hours (9:00 AM - 4:00 PM IST = 3:30 AM - 10:30 AM UTC)
    - cron: '*/14 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping backend
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} — %{time_total}s\n" \
            "${{ secrets.API_BASE_URL }}/health" \
            --max-time 30 || echo "Backend unreachable (cold start expected)"
