# ============================================================================
# QuantDesk Pro — GitHub Actions: Morning Rankings Cron
# Runs at 8:45 AM IST (3:15 AM UTC) on weekdays
# Also runs on first manual trigger (workflow_dispatch)
# ============================================================================

name: Morning Rankings Computation

on:
  schedule:
    # 8:45 AM IST = 3:15 AM UTC (IST is UTC+5:30)
    # Run on weekdays only (Mon-Fri)
    - cron: '15 3 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  compute-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Compute Morning Rankings
        run: |
          echo "🕐 Triggering morning rankings computation at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Trigger the ranking computation endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_JWT_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.API_BASE_URL }}/api/v1/rankings/compute" \
            --max-time 120)
          
          echo "Response code: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
            echo "✅ Rankings computed successfully"
          else
            echo "❌ Rankings computation failed with HTTP $RESPONSE"
            exit 1
          fi

      - name: Warm up risk cache
        if: success()
        run: |
          echo "📊 Warming up risk metrics cache..."
          
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_JWT_TOKEN }}" \
            "${{ secrets.API_BASE_URL }}/api/v1/risk/recalculate" \
            --max-time 120 || true
          
          echo "✅ Risk cache warmed"

      - name: Health check
        if: always()
        run: |
          echo "🏥 Running health check..."
          
          HEALTH=$(curl -s "${{ secrets.API_BASE_URL }}/health" --max-time 10)
          echo "Health: $HEALTH"
